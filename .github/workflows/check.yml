name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [headless, sanitized, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/bootstrap.sh ${{ matrix.preset }}
      - run: |
          git log --format=%B | ./tools/lint/CheckCommitMsg.sh /dev/stdin
